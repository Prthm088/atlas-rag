name: Supabase maintenance

on:
  workflow_dispatch:
    inputs:
      task:
        description: Generate database types or apply pending production migrations
        required: true
        type: choice
        options:
          - generate-types
          - migrate-production

permissions:
  contents: read

jobs:
  maintain:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v2
        with:
          version: 2.111.0
      - name: Generate TypeScript database types
        if: inputs.task == 'generate-types'
        run: supabase gen types typescript --project-id "$SUPABASE_PROJECT_ID" > database.types.ts
      - name: Upload generated types
        if: inputs.task == 'generate-types'
        uses: actions/upload-artifact@v7
        with:
          name: supabase-database-types
          path: database.types.ts
          archive: false
      - name: Link production project
        if: inputs.task == 'migrate-production'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply pending migrations
        if: inputs.task == 'migrate-production'
        run: supabase db push --linked --include-all
